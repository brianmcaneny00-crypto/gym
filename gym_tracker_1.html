<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gym Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&display=swap');
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #222; --border: #2e2e2e;
    --text: #f0f0f0; --muted: #888; --accent: #c8f55a; --accent-dim: rgba(200,245,90,0.12);
    --accent-text: #1a2200; --ss-color: #5ab4f5; --ss-bg: rgba(90,180,245,0.12);
    --done-bg: rgba(200,245,90,0.08); --danger: #f55a5a; --radius: 12px; --radius-sm: 8px;
    font-family: 'DM Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; max-width: 480px; margin: 0 auto; }

  #sync-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); min-height: 36px; }
  #sync-status { display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .sync-dot.ok { background: var(--accent); }
  .sync-dot.busy { background: #f5c842; animation: pulse 1s infinite; }
  .sync-dot.err { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #sign-btn { padding: 5px 12px; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 20px; color: var(--accent); font-size: 10px; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; }

  .tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 36px; z-index: 100; }
  .tab { flex: 1; padding: 13px 0; text-align: center; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s; }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  .day-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .day-card:hover { border-color: var(--accent); background: var(--bg3); }
  .dc-name { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .dc-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dc-prog { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .prog-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .prog-label { font-size: 11px; color: var(--muted); min-width: 36px; text-align: right; }

  #wv { display: none; }
  .back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 0 0 14px; font-family: inherit; letter-spacing: 0.06em; text-transform: uppercase; }
  .wv-title { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 4px; }
  .wv-hint { font-size: 11px; color: var(--muted); margin-bottom: 16px; letter-spacing: 0.04em; }
  .sec-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ss-color); margin: 16px 0 6px 2px; display: flex; align-items: center; gap: 6px; }
  .sec-lbl::before { content:''; display:inline-block; width:8px; height:1px; background:var(--ss-color); }

  .ex-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
  .ex-card.completed { border-color: var(--accent); background: var(--done-bg); }
  .ex-hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
  .ex-hdr-left { flex: 1; min-width: 0; }
  .ex-nm { font-size: 13px; font-weight: 600; }
  .ex-mt { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ex-last { font-size: 10px; color: var(--ss-color); margin-top: 3px; letter-spacing: 0.02em; }
  .ex-badges { display: flex; gap: 5px; align-items: center; flex-shrink: 0; margin-left: 8px; }
  .bdg { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; letter-spacing: 0.04em; }
  .bdg-ss { background: var(--ss-bg); color: var(--ss-color); }
  .bdg-up { background: var(--accent-dim); color: var(--accent); }
  .bdg-ok { background: var(--accent-dim); color: var(--accent); }
  .chev { font-size: 10px; color: var(--muted); margin-left: 4px; transition: transform 0.2s; display: inline-block; }
  .ex-card.open .chev { transform: rotate(180deg); }
  .ex-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .ex-card.open .ex-body { display: block; }

  .last-session-bar { background: var(--bg3); border-radius: var(--radius-sm); padding: 8px 10px; margin: 10px 0 8px; font-size: 11px; color: var(--muted); border-left: 2px solid var(--ss-color); }
  .last-session-bar .ls-title { font-size: 10px; color: var(--ss-color); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .last-session-sets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .ls-set { font-size: 11px; color: var(--muted); background: var(--bg2); padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); }

  .sets-hdr { display: grid; grid-template-columns: 28px 1fr 1fr 34px; gap: 6px 8px; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 0 6px; }
  .set-row { display: grid; grid-template-columns: 28px 1fr 1fr 34px; gap: 6px 8px; align-items: center; margin-bottom: 6px; }
  .set-num { font-size: 12px; color: var(--muted); text-align: center; }
  .set-in { width: 100%; padding: 7px 9px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: inherit; }
  .set-in:focus { outline: none; border-color: var(--accent); }
  .set-in.prefilled { border-color: #3a4a2a; color: var(--accent); }
  .set-ck { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--muted); font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .set-ck.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .prog-tip { background: var(--accent-dim); color: var(--accent); font-size: 12px; padding: 8px 10px; border-radius: var(--radius-sm); margin: 8px 0 4px; }
  .comp-btn { width: 100%; padding: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--muted); font-size: 12px; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 10px; transition: all 0.15s; }
  .comp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .comp-btn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  .end-workout-btn { width: 100%; padding: 14px; background: var(--danger); border: none; border-radius: var(--radius); color: #fff; font-size: 13px; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; margin-top: 24px; margin-bottom: 8px; }

  .mob-section { margin-bottom: 20px; }
  .mob-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .mob-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 7px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .mob-item.on { background: var(--done-bg); border-color: var(--accent); color: var(--accent); }
  .mob-ck { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  .mob-item.on .mob-ck { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .he { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .he-day { font-size: 10px; color: var(--ss-color); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
  .he-date { font-size: 11px; color: var(--muted); }
  .he-name { font-size: 13px; font-weight: 600; margin: 3px 0 2px; }
  .he-sets { font-size: 12px; color: var(--muted); line-height: 1.6; }

  .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--accent); }
  .sec-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .pr-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 7px; font-size: 13px; }
  .pr-name { color: var(--text); flex: 1; margin-right: 12px; font-size: 12px; }
  .pr-val { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .action-btn { width: 100%; padding: 10px; border-radius: var(--radius-sm); font-size: 11px; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 8px; font-weight: 600; }
  .export-btn { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); margin-top: 20px; }
  .clear-btn { background: none; border: 1px solid var(--border); color: var(--muted); }
  .clear-btn:hover { border-color: var(--danger); color: var(--danger); }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 16px; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin: 20px; max-width: 340px; width: 100%; }
  .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 11px; border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
  .modal-cancel { background: none; border: 1px solid var(--border); color: var(--muted); }
  .modal-confirm { background: var(--danger); border: none; color: #fff; }
</style>
</head>
<body>

<div id="sync-bar">
  <div id="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-msg">Not signed in</span></div>
  <button id="sign-btn" onclick="handleSignIn()">Sign in with Google</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="ST('gym')">Gym</div>
  <div class="tab" onclick="ST('mob')">Mobility</div>
  <div class="tab" onclick="ST('hist')">History</div>
  <div class="tab" onclick="ST('stats')">Stats</div>
</div>

<div id="gym" class="screen active">
  <div id="dl">
    <p style="font-size:11px;color:#666;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:14px">Select workout</p>
    <div class="day-card" onclick="OD('mon')">
      <div class="dc-name">Monday</div><div class="dc-sub">Chest &amp; Triceps</div>
      <div class="dc-prog"><div class="prog-bar"><div class="prog-fill" id="p-mon" style="width:0%"></div></div><span class="prog-label" id="pl-mon">0/0</span></div>
    </div>
    <div class="day-card" onclick="OD('wed')">
      <div class="dc-name">Wednesday</div><div class="dc-sub">Back &amp; Biceps</div>
      <div class="dc-prog"><div class="prog-bar"><div class="prog-fill" id="p-wed" style="width:0%"></div></div><span class="prog-label" id="pl-wed">0/0</span></div>
    </div>
    <div class="day-card" onclick="OD('fri')">
      <div class="dc-name">Friday</div><div class="dc-sub">Legs &amp; Shoulders</div>
      <div class="dc-prog"><div class="prog-bar"><div class="prog-fill" id="p-fri" style="width:0%"></div></div><span class="prog-label" id="pl-fri">0/0</span></div>
    </div>
  </div>
  <div id="wv"></div>
</div>

<div id="mob" class="screen">
  <div class="mob-section"><div class="mob-title">Morning</div><div id="mam"></div></div>
  <div class="mob-section"><div class="mob-title">Evening</div><div id="mpm"></div></div>
</div>
<div id="hist" class="screen"><div id="hl"></div></div>
<div id="stats" class="screen"><div id="stc"></div></div>

<div class="modal-overlay" id="end-modal">
  <div class="modal">
    <h3>End Workout</h3>
    <p>This will save your session to history and reset today's workout. Weight increase recommendations will be kept for next time.</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmEndWorkout()">End &amp; Save</button>
    </div>
  </div>
</div>

<script>
var WD = {
  mon: { name: "Monday — Chest & Triceps", groups: [
    {t:"s", e:[{n:"Barbell bench press",s:4,r:"6-8"}]},
    {t:"ss", e:[{n:"Dumbbell incline press",s:3,r:"10-12"},{n:"Pec deck / cable crossover",s:3,r:"12-15"}]},
    {t:"ss", e:[{n:"Dumbbell flat fly",s:3,r:"12"},{n:"Dips (weighted)",s:3,r:"8-10"}]},
    {t:"s", e:[{n:"Landmine press",s:3,r:"10-12"}]},
    {t:"ss", e:[{n:"Skull crushers",s:3,r:"10-12"},{n:"Tricep pushdown (bar)",s:3,r:"12-15"}]},
    {t:"ss", e:[{n:"Cable overhead tricep extension",s:3,r:"12"},{n:"Diamond push-up",s:2,r:"max"}]},
    {t:"ss", e:[{n:"Ab wheel rollout",s:3,r:"10"},{n:"Side plank",s:3,r:"30-45sec"}]},
    {t:"s", e:[{n:"Pallof press",s:3,r:"10/side"}]}
  ]},
  wed: { name: "Wednesday — Back & Biceps", groups: [
    {t:"s", e:[{n:"Trap bar deadlift",s:4,r:"6-8"}]},
    {t:"ss", e:[{n:"Weighted pull-ups",s:4,r:"6-8"},{n:"Chest-supported dumbbell row",s:3,r:"10-12"}]},
    {t:"ss", e:[{n:"Single-arm cable row",s:3,r:"12"},{n:"EZ bar curl",s:3,r:"10-12"}]},
    {t:"ss", e:[{n:"Seated cable row (wide grip)",s:3,r:"12"},{n:"Incline dumbbell curl",s:3,r:"12"}]},
    {t:"ss", e:[{n:"Straight-arm pulldown",s:3,r:"15"},{n:"Concentration curl",s:3,r:"12"}]},
    {t:"ss", e:[{n:"Face pulls",s:3,r:"15"},{n:"Reverse curl",s:3,r:"12"}]},
    {t:"ss", e:[{n:"Cable woodchop",s:3,r:"10/side"},{n:"Hanging leg raise",s:3,r:"12"}]},
    {t:"s", e:[{n:"Superman hold",s:3,r:"10"}]}
  ]},
  fri: { name: "Friday — Legs & Shoulders", groups: [
    {t:"s", e:[{n:"Low bar squat",s:4,r:"6-8"}]},
    {t:"ss", e:[{n:"Hack squat",s:4,r:"10-12"},{n:"Nordic curl",s:3,r:"6-8"}]},
    {t:"ss", e:[{n:"Walking lunges",s:3,r:"12/leg"},{n:"Romanian deadlift",s:3,r:"10-12"}]},
    {t:"s", e:[{n:"Leg extension",s:3,r:"15"}]},
    {t:"ss", e:[{n:"Barbell hip thrust",s:4,r:"10-12"},{n:"Lying leg curl",s:3,r:"12"}]},
    {t:"ss", e:[{n:"Standing calf raise",s:4,r:"15-20"},{n:"Seated calf raise",s:3,r:"15"}]},
    {t:"s", e:[{n:"Dumbbell shoulder press",s:4,r:"8-10"}]},
    {t:"ss", e:[{n:"Cable lateral raise",s:3,r:"15"},{n:"Bent-over rear delt fly",s:3,r:"15"}]},
    {t:"s", e:[{n:"Barbell upright row",s:3,r:"12"}]},
    {t:"ss", e:[{n:"Dead bug",s:3,r:"10/side"},{n:"Pallof press",s:3,r:"10/side"}]},
    {t:"s", e:[{n:"Single-leg glute bridge",s:3,r:"12/leg"}]}
  ]}
};

var MAM = ["Hip flexor kneeling stretch","Cat-cow","Banded shoulder dislocates","Lateral lunge stretch","Thoracic rotation with reach","Wrist circles"];
var MPM = ["Foam roll hamstrings + glutes","Foam roll lats","Doorway chest stretch","Supine spinal twist"];

var CLIENT_ID = "957672334066-ot38g5tf5go6gnfvv3k3jee3lnv9lmuq.apps.googleusercontent.com";
var SCOPES = "https://www.googleapis.com/auth/drive.appdata";
var FILE_NAME = "gym_tracker_data.json";
var driveFileId = null;
var tokenClient = null;
var accessToken = null;
var saveTimer = null;
var currentEndDay = null;

function LD() { try { return JSON.parse(localStorage.getItem("gt7") || "{}"); } catch(e) { return {}; } }
function SDLocal(d) { try { localStorage.setItem("gt7", JSON.stringify(d)); } catch(e) {} }
var D = LD();
var CD = null;

// ── LAST SESSION LOOKUP ───────────────────────────────────────
// Build a map of exercise name -> most recent history entry
function buildLastSessionMap() {
  var history = D._history || [];
  var map = {};
  // History is newest first, so first match per exercise is the last session
  for (var i = 0; i < history.length; i++) {
    var e = history[i];
    var nm = e.exercise;
    if (!map[nm] && e.sets && e.sets.length > 0) {
      map[nm] = e;
    }
  }
  return map;
}

function getLastSessionSummary(exName) {
  var map = buildLastSessionMap();
  var entry = map[exName];
  if (!entry || !entry.sets || !entry.sets.length) return null;
  var sets = entry.sets.filter(function(s) { return s.weight; });
  if (!sets.length) return null;
  var d = new Date(entry.date);
  var dateStr = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return { sets: sets, date: dateStr, raw: entry };
}

function getPrefilledWeights(exName, numSets) {
  var map = buildLastSessionMap();
  var entry = map[exName];
  if (!entry || !entry.sets || !entry.sets.length) return [];
  var weights = entry.sets.map(function(s) { return s.weight || ""; });
  // Pad or trim to match numSets
  while (weights.length < numSets) weights.push(weights[weights.length - 1] || "");
  return weights.slice(0, numSets);
}

// ── SYNC ──────────────────────────────────────────────────────
function setSyncStatus(state, msg) {
  document.getElementById("sync-dot").className = "sync-dot " + state;
  document.getElementById("sync-msg").textContent = msg;
}

window.onload = function() {
  if (typeof google !== "undefined" && google.accounts) { initGoogleAuth(); }
  else { var t = setInterval(function() { if (typeof google !== "undefined" && google.accounts) { clearInterval(t); initGoogleAuth(); } }, 300); }
};

function initGoogleAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: function(resp) {
      if (resp.error) { setSyncStatus("err", "Auth error"); return; }
      accessToken = resp.access_token;
      document.getElementById("sign-btn").textContent = "Signed in";
      document.getElementById("sign-btn").disabled = true;
      setSyncStatus("busy", "Loading data…");
      loadFromDrive();
    }
  });
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES, prompt: "",
    callback: function(resp) {
      if (!resp.error) {
        accessToken = resp.access_token;
        document.getElementById("sign-btn").textContent = "Signed in";
        document.getElementById("sign-btn").disabled = true;
        setSyncStatus("busy", "Loading data…");
        loadFromDrive();
      }
    }
  }).requestAccessToken();
}

function handleSignIn() { if (tokenClient) tokenClient.requestAccessToken({ prompt: "consent" }); }

function loadFromDrive() {
  fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=name+%3d+%27" + FILE_NAME + "%27", {
    headers: { Authorization: "Bearer " + accessToken }
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.files && data.files.length > 0) {
      driveFileId = data.files[0].id;
      return fetch("https://www.googleapis.com/drive/v3/files/" + driveFileId + "?alt=media", {
        headers: { Authorization: "Bearer " + accessToken }
      }).then(function(r) { return r.json(); }).then(function(saved) {
        if (saved && typeof saved === "object") { D = saved; SDLocal(D); }
        setSyncStatus("ok", "Synced with Drive");
        UDS(); if (CD) OD(CD);
      });
    } else { setSyncStatus("ok", "Drive connected"); }
  }).catch(function() { setSyncStatus("err", "Load failed"); });
}

function saveToDrive() {
  if (!accessToken) { SDLocal(D); return; }
  setSyncStatus("busy", "Saving…");
  var body = JSON.stringify(D);
  if (driveFileId) {
    fetch("https://www.googleapis.com/upload/drive/v3/files/" + driveFileId + "?uploadType=media", {
      method: "PATCH", headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json" }, body: body
    }).then(function() { SDLocal(D); setSyncStatus("ok", "Saved to Drive"); })
      .catch(function() { SDLocal(D); setSyncStatus("err", "Save failed (local backup done)"); });
  } else {
    var meta = JSON.stringify({ name: FILE_NAME, parents: ["appDataFolder"] });
    var boundary = "gt7boundary";
    var multipart = "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + meta +
      "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + body + "\r\n--" + boundary + "--";
    fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST", headers: { Authorization: "Bearer " + accessToken, "Content-Type": "multipart/related; boundary=" + boundary }, body: multipart
    }).then(function(r) { return r.json(); }).then(function(f) {
      driveFileId = f.id; SDLocal(D); setSyncStatus("ok", "Saved to Drive");
    }).catch(function() { SDLocal(D); setSyncStatus("err", "Save failed (local backup done)"); });
  }
}

function scheduleSave() {
  SDLocal(D);
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToDrive, 1500);
}

// ── UI ────────────────────────────────────────────────────────
function ST(t) {
  ["gym","mob","hist","stats"].forEach(function(id, i) {
    document.getElementById(id).classList.toggle("active", id === t);
    document.querySelectorAll(".tab")[i].classList.toggle("active", id === t);
  });
  if (t === "hist") RH();
  if (t === "stats") RS();
  if (t === "mob") RM();
}

function EK(day, nm) { return day + "|" + nm; }
function topR(r) { var m = r.match(/(\d+)(?:-(\d+))?/); if (!m) return null; return m[2] ? +m[2] : +m[1]; }

function UDS() {
  ["mon","wed","fri"].forEach(function(day) {
    var w = WD[day]; var tot = 0, dn = 0;
    w.groups.forEach(function(g) { g.e.forEach(function(ex) { tot++; var k = EK(day,ex.n); if (D[k]&&D[k].completed) dn++; }); });
    var pct = tot ? Math.round(dn/tot*100) : 0;
    var pf = document.getElementById("p-"+day); var pl = document.getElementById("pl-"+day);
    if (pf) pf.style.width = pct + "%";
    if (pl) pl.textContent = dn+"/"+tot;
  });
}

function OD(day) {
  CD = day;
  document.getElementById("dl").style.display = "none";
  var wv = document.getElementById("wv");
  wv.style.display = "block";
  wv.innerHTML = buildWorkout(day);
}

function buildWorkout(day) {
  var w = WD[day];
  var h = '<button class="back-btn" onclick="BD()">&#8592; back</button>';
  h += '<div class="wv-title">' + w.name + '</div>';
  h += '<div class="wv-hint">Reverse pyramid — heaviest set first</div>';
  var ssIdx = 0;
  w.groups.forEach(function(g) {
    if (g.t === "ss") { ssIdx++; h += '<div class="sec-lbl">Superset ' + ssIdx + '</div>'; }
    g.e.forEach(function(ex) {
      var k = EK(day, ex.n);
      var ed = D[k] || { sets: [], completed: false };
      var isDone = ed.completed;
      var tr = topR(ex.r);
      var allHit = tr && ed.sets.length >= ex.s && ed.sets.every(function(s) { return s.reps && +s.reps >= tr; });
      var cid = "C_" + k.replace(/[^a-zA-Z0-9]/g, "_");
      var isOpen = ed._open || false;
      var ek = k.replace(/\\/g,"\\\\").replace(/'/g,"\\'");

      // Last session data
      var lastSession = getLastSessionSummary(ex.n);
      var preWeights = getPrefilledWeights(ex.n, ex.s);
      var lastLabel = "";
      if (lastSession) {
        var topSet = lastSession.sets[0];
        lastLabel = "Last " + lastSession.date + ": " + topSet.weight + "lb &times; " + (topSet.reps || "?") + " reps";
      }

      h += '<div class="ex-card'+(isDone?" completed":"")+(isOpen?" open":"")+ '" id="'+cid+'">';
      h += '<div class="ex-hdr" onclick="TX(\''+ek+'\')"><div class="ex-hdr-left">';
      h += '<div class="ex-nm">'+ex.n+'</div>';
      h += '<div class="ex-mt">'+ex.s+'&times;'+ex.r+'</div>';
      if (lastLabel) h += '<div class="ex-last">'+lastLabel+'</div>';
      h += '</div>';
      h += '<div class="ex-badges">';
      if (g.t==="ss") h += '<span class="bdg bdg-ss">SS</span>';
      if (allHit&&!isDone) h += '<span class="bdg bdg-up">+5 lb</span>';
      if (isDone) h += '<span class="bdg bdg-ok">&#10003;</span>';
      h += '<span class="chev">&#9660;</span></div></div>';

      h += '<div class="ex-body">';

      // Last session detail bar
      if (lastSession && lastSession.sets.length > 0) {
        h += '<div class="last-session-bar">';
        h += '<div class="ls-title">Last session — ' + lastSession.date + '</div>';
        h += '<div class="last-session-sets">';
        lastSession.sets.forEach(function(s, i) {
          if (s.weight) h += '<span class="ls-set">S'+(i+1)+': '+s.weight+'lb&times;'+(s.reps||'?')+'</span>';
        });
        h += '</div></div>';
      }

      h += '<div class="sets-hdr"><span>Set</span><span>Weight</span><span>Reps</span><span></span></div>';
      for (var s = 0; s < ex.s; s++) {
        var sd = ed.sets[s] || {};
        // Use saved value if exists, otherwise prefill from last session
        var weightVal = sd.weight !== undefined ? sd.weight : (preWeights[s] || "");
        var isPrefilled = (sd.weight === undefined || sd.weight === "") && preWeights[s];
        h += '<div class="set-row">';
        h += '<span class="set-num">'+(s+1)+'</span>';
        h += '<input class="set-in'+(isPrefilled?" prefilled":"")+ '" type="number" placeholder="0" value="'+weightVal+'" step="2.5" min="0" onchange="SV(\''+ek+'\','+s+',\'weight\',this.value);this.classList.remove(\'prefilled\')">';
        h += '<input class="set-in" type="number" placeholder="0" value="'+(sd.reps||"")+'" min="0" onchange="SV(\''+ek+'\','+s+',\'reps\',this.value)">';
        h += '<button class="set-ck'+(sd.done?" on":"")+ '" onclick="TSD(\''+ek+'\','+s+',this)">'+(sd.done?"&#10003;":"&#9675;")+'</button>';
        h += '</div>';
      }
      if (allHit&&!isDone) h += '<div class="prog-tip">All sets hit top range — consider +5 lb next session</div>';
      h += '<button class="comp-btn'+(isDone?" on":"")+ '" id="cb-'+cid+'" onclick="TC(\''+ek+'\',\''+day+'\',this)">'+
        (isDone?"&#10003; Completed":"Mark complete")+'</button>';
      h += '</div></div>';
    });
  });
  h += '<button class="end-workout-btn" onclick="endWorkout(\''+day+'\')">End Workout</button>';
  return h;
}

function BD() { CD=null; document.getElementById("dl").style.display="block"; document.getElementById("wv").style.display="none"; document.getElementById("wv").innerHTML=""; UDS(); }

function TX(k) {
  if (!D[k]) D[k]={sets:[],completed:false};
  D[k]._open = !D[k]._open;
  var cid = "C_"+k.replace(/[^a-zA-Z0-9]/g,"_");
  var card = document.getElementById(cid);
  if (card) card.classList.toggle("open");
  scheduleSave();
}

function SV(k, si, field, val) {
  if (!D[k]) D[k]={sets:[],completed:false};
  while (D[k].sets.length<=si) D[k].sets.push({});
  D[k].sets[si][field] = val;
  scheduleSave();
  checkBadge(k);
}

function checkBadge(k) {
  var parts=k.split("|"); var day=parts[0]; var nm=parts.slice(1).join("|");
  var ex=null;
  for (var gi=0;gi<WD[day].groups.length;gi++) { var g=WD[day].groups[gi]; for (var ei=0;ei<g.e.length;ei++) { if(g.e[ei].n===nm){ex=g.e[ei];break;} } if(ex)break; }
  if (!ex) return;
  var tr=topR(ex.r); if(!tr) return;
  var ed=D[k]||{sets:[]};
  var allHit=ed.sets.length>=ex.s&&ed.sets.every(function(s){return s.reps&&+s.reps>=tr;});
  var cid="C_"+k.replace(/[^a-zA-Z0-9]/g,"_");
  var card=document.getElementById(cid); if(!card) return;
  var badges=card.querySelector(".ex-badges"); if(!badges) return;
  var existing=badges.querySelector(".bdg-up");
  if (allHit&&!ed.completed) { if(!existing){var sp=document.createElement("span");sp.className="bdg bdg-up";sp.textContent="+5 lb";badges.insertBefore(sp,badges.querySelector(".chev"));} }
  else { if(existing) existing.remove(); }
}

function TSD(k, si, btn) {
  if (!D[k]) D[k]={sets:[],completed:false};
  while (D[k].sets.length<=si) D[k].sets.push({});
  D[k].sets[si].done = !D[k].sets[si].done;
  var on = D[k].sets[si].done;
  btn.classList.toggle("on", on);
  btn.innerHTML = on ? "&#10003;" : "&#9675;";
  scheduleSave();
}

function TC(k, day, btn) {
  if (!D[k]) D[k]={sets:[],completed:false};
  D[k].completed = !D[k].completed;
  if (D[k].completed) {
    if (!D._history) D._history=[];
    D._history.unshift({date:new Date().toISOString(),day:day,exercise:k.split("|").slice(1).join("|"),sets:JSON.parse(JSON.stringify(D[k].sets))});
    UPR(k, D[k].sets);
  }
  var cid="C_"+k.replace(/[^a-zA-Z0-9]/g,"_");
  var card=document.getElementById(cid);
  if (card) {
    card.classList.toggle("completed", D[k].completed);
    if (btn) { btn.classList.toggle("on",D[k].completed); btn.innerHTML=D[k].completed?"&#10003; Completed":"Mark complete"; }
    var badges=card.querySelector(".ex-badges");
    if (badges) {
      var ok=badges.querySelector(".bdg-ok");
      if (D[k].completed&&!ok){var sp=document.createElement("span");sp.className="bdg bdg-ok";sp.innerHTML="&#10003;";badges.insertBefore(sp,badges.querySelector(".chev"));}
      else if(!D[k].completed&&ok) ok.remove();
    }
  }
  scheduleSave(); UDS();
}

function UPR(k, sets) {
  if (!D._prs) D._prs={};
  var nm=k.split("|").slice(1).join("|");
  var best=sets.reduce(function(mx,s){var w=parseFloat(s.weight)||0;return w>mx?w:mx;},0);
  if (!D._prs[nm]||best>D._prs[nm]) D._prs[nm]=best;
}

function endWorkout(day) {
  currentEndDay = day;
  document.getElementById("end-modal").classList.add("show");
}

function closeModal() {
  document.getElementById("end-modal").classList.remove("show");
  currentEndDay = null;
}

function confirmEndWorkout() {
  var day = currentEndDay;
  closeModal();
  if (!day) return;
  var progressionFlags = {};
  WD[day].groups.forEach(function(g) {
    g.e.forEach(function(ex) {
      var k = EK(day, ex.n);
      var ed = D[k] || { sets: [] };
      var tr = topR(ex.r);
      var allHit = tr && ed.sets.length >= ex.s && ed.sets.every(function(s) { return s.reps && +s.reps >= tr; });
      if (allHit) progressionFlags[k] = true;
    });
  });
  WD[day].groups.forEach(function(g) {
    g.e.forEach(function(ex) {
      var k = EK(day, ex.n);
      delete D[k];
    });
  });
  Object.keys(progressionFlags).forEach(function(k) {
    D[k] = { sets: [], completed: false, _open: false, _needsIncrease: true };
  });
  scheduleSave();
  BD();
  setSyncStatus("ok", "Workout saved ✓");
}

function RM() {
  function bl(items, prefix, cid) {
    var c=document.getElementById(cid); if(!c) return;
    c.innerHTML=items.map(function(item,i){
      var k="_mob_"+prefix+"_"+i; var on=D[k]||false;
      return '<div class="mob-item'+(on?" on":"")+'" onclick="TM(\''+k+'\')"><div class="mob-ck">'+(on?"&#10003;":"")+"</div>"+item+"</div>";
    }).join("");
  }
  bl(MAM,"am","mam"); bl(MPM,"pm","mpm");
}
function TM(k) { D[k]=!D[k]; scheduleSave(); RM(); }

function RH() {
  var c=document.getElementById("hl");
  var h=D._history||[];
  if (!h.length){c.innerHTML='<div class="empty">No workouts logged yet</div>';return;}
  var dayNames={mon:"Chest & Triceps",wed:"Back & Biceps",fri:"Legs & Shoulders"};
  c.innerHTML=h.slice(0,100).map(function(e){
    var d=new Date(e.date);
    var ds=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    var setLines=(e.sets||[]).filter(function(s){return s.weight;}).map(function(s,i){return "Set "+(i+1)+": "+s.weight+"lb &times; "+(s.reps||"?")+" reps";}).join("<br>");
    return '<div class="he"><div class="he-day">'+(dayNames[e.day]||e.day)+'</div><div class="he-date">'+ds+'</div><div class="he-name">'+e.exercise+'</div>'+(setLines?'<div class="he-sets">'+setLines+'</div>':'')+'</div>';
  }).join("");
}

function RS() {
  var c=document.getElementById("stc");
  var h=D._history||[];
  var sess=new Set(h.map(function(e){return e.date.slice(0,10);})).size;
  var prs=D._prs||{};
  var pe=Object.entries(prs).sort(function(a,b){return b[1]-a[1];});
  var html='<div class="stat-grid">';
  html+='<div class="stat-card"><div class="stat-lbl">Sessions</div><div class="stat-val">'+sess+'</div></div>';
  html+='<div class="stat-card"><div class="stat-lbl">Exercises logged</div><div class="stat-val">'+h.length+'</div></div>';
  html+='</div><div class="sec-title">PR Board</div>';
  if (!pe.length) html+='<div class="empty">No PRs yet</div>';
  else html+=pe.map(function(p){return'<div class="pr-row"><span class="pr-name">'+p[0]+'</span><span class="pr-val">'+p[1]+' lb</span></div>';}).join("");
  html+='<button class="action-btn export-btn" onclick="EXP()">&#8595; Export history (JSON)</button>';
  html+='<button class="action-btn clear-btn" onclick="CLR()">Clear all data</button>';
  c.innerHTML=html;
}

function EXP() {
  var payload={exported:new Date().toISOString(),history:D._history||[],prs:D._prs||{}};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="gym_history_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function CLR() {
  if (confirm("Clear all workout data? This cannot be undone.")) { D={}; scheduleSave(); RS(); UDS(); alert("Data cleared."); }
}

UDS();
</script>
</body>
</html>
